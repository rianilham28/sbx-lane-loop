# Formatting, lints, the unit tests and the conformance suite — first against
# the crate's own build, then against the release binary the tags publish.
# The bash half of the conformance suite stays off here: its source lives in a
# private repository and is not vendored.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rustup reads rust-toolchain.toml: the exact channel, rustfmt and
      # clippy, and the musl targets. No compiler floats between runs.
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustc --version

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Conformance against the release binary
        run: |
          cargo build --locked --release
          LANE_LOOP_BIN="$PWD/target/release/sbx-lane-loop" \
            cargo test --locked --test conformance
